[project]
name = "prawless"
version = "0.1.0"
description = "Python Reddit API Interaction Library"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "httpx",
    "fake-useragent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prawless"]
